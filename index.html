<!DOCTYPE html>
<html>
<head>
<title>Dot Matrix Printer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

p {
    color: #ccc;
    margin-bottom: 30px;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #6c63ff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #8a84ff;
}
</style>
</head>

<body>

<div class="container">
    <h1>🖨️ Dot Matrix Printer</h1>
    <p>Convert images into printable ASCII format</p>

    <button onclick="start()">Get Started</button>
</div>

<script>
function start() {
    window.location.href = "upload.html";
}
</script>

</body>
</html>
